<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="icon" href="{{ "/assets/favicon.svg" | relative_url }}" type="image/svg+xml">
  <meta name="theme-color" content="#080b11">

  {% unless page.image %}
    <meta property="og:image" content="{{ "/assets/social-card.png" | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ "/assets/social-card.png" | absolute_url }}">
  {% endunless %}

  {% feed_meta %}
</head>
