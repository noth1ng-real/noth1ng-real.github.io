<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="preload" href="{{ "/assets/fonts/InterVariable.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ "/assets/fonts/JetBrainsMono-Regular.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="icon" href="{{ "/assets/favicon.png" | relative_url }}" type="image/png" sizes="512x512">
  <link rel="icon" href="{{ "/assets/favicon-32.png" | relative_url }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ "/assets/apple-touch-icon.png" | relative_url }}" sizes="180x180">
  <meta name="theme-color" content="#080b11">

  {% unless page.image %}
    <meta property="og:image" content="{{ "/assets/social-card.png" | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ "/assets/social-card.png" | absolute_url }}">
  {% endunless %}

  {% feed_meta %}
</head>
