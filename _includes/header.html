<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>
      <svg class="site-mark" viewBox="0 0 36 28" width="28" height="22" aria-hidden="true" focusable="false">
        <path d="M2 18 8 6l10-4 7 5 9 3-5 13-13 3Z" fill="#101722"/>
        <path d="m8 6 10-4-3 10-13 6Z" fill="#34445c"/>
        <path d="m18 2 7 5-10 5Z" fill="#e8edf5"/>
        <path d="m25 7 9 3-12 5-7-3Z" fill="#566579"/>
        <path d="m22 15 12-5-5 13-8-4Z" fill="#1d2939"/>
        <path d="m5 17 9-5 7 3-5 7-11 2Z" fill="#f4f7fb"/>
        <path d="m21 15 9-3-3 7-8 1Z" fill="#dce8ff"/>
        <path d="m6 22 10-2 5-5-5 8-10 2Z" fill="#5b8def"/>
        <path d="m26 18 4-6 2 1-4 6Z" fill="#c93cff"/>
        <path d="m12 11 3-1-2 4-3 1Z" fill="#38d6e8"/>
      </svg>
      <span>{{ site.title | escape }}</span>
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <input type="checkbox" id="nav-trigger" class="nav-trigger">
      <label for="nav-trigger">
        <span class="menu-icon">
          <svg viewBox="0 0 18 15" width="18" height="15" aria-hidden="true">
            <path d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484S0.665,0,1.484,0h15.032C17.335,0,18,0.665,18,1.484z M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516s0.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516z M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516s0.665-1.484,1.484-1.484h15.032C17.335,12.031,18,12.696,18,13.516z"/>
          </svg>
        </span>
      </label>

      <div class="trigger">
        {% for path in site.header_pages %}
          {% assign nav_page = site.pages | where: "path", path | first %}
          {% if nav_page.title %}
            <a class="page-link{% if page.url == nav_page.url %} is-active{% endif %}" href="{{ nav_page.url | relative_url }}"{% if page.url == nav_page.url %} aria-current="page"{% endif %}>{{ nav_page.title | escape }}</a>
          {% endif %}
        {% endfor %}

        <div class="global-search" data-global-search data-index-url="{{ "/assets/search.json" | relative_url }}">
          <svg class="global-search-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 4.5 4.5"></path>
          </svg>
          <input type="search" aria-label="Search posts" placeholder="Search posts…" autocomplete="off" spellcheck="false" aria-expanded="false">
          <kbd aria-hidden="true">/</kbd>
          <div class="global-search-panel" hidden>
            <p class="global-search-status" aria-live="polite"></p>
            <div class="global-search-results"></div>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>

<script src="{{ "/assets/search.js" | relative_url }}" defer></script>
